services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abdrabo_attendance}
      POSTGRES_USER: ${POSTGRES_USER:-abdrabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-@abdrabo_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abdrabo} -d ${POSTGRES_DB:-abdrabo_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TOKEN_SECRET: ${TOKEN_SECRET}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PRIMARY_OWNER_USER_ID: ${PRIMARY_OWNER_USER_ID:-1}
      TRUST_PROXY: "1"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    #depends_on:
      #postgres:
        #condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      # - postgres
      - backend

volumes:
  postgres-data:
