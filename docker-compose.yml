services:

  # =========================================================
  # PostgreSQL
  # =========================================================
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abdrabo_attendance}
      POSTGRES_USER: ${POSTGRES_USER:-abdrabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - database_net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-abdrabo} -d ${POSTGRES_DB:-abdrabo_attendance}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    privileged: false

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # =========================================================
  # Backend
  # =========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    environment:
      NODE_ENV: production
      PORT: 4000

      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}

      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_FROM_EMAIL: ${PASSWORD_RESET_FROM_EMAIL:-}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Mr. Ahmed Abdrabo System}"
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}

      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}

      PRIMARY_OWNER_USER_ID: ${PRIMARY_OWNER_USER_ID:-1}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://abdrabo.up.railway.app}

      TRUST_PROXY: "1"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - whatsapp-auth:/app/backend/whatsapp_auth

    networks:
      - database_net
      - application_net

    expose:
      - "4000"

    user: "appuser"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    privileged: false

    read_only: true

    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev

    pids_limit: 200

    init: true

    restart: unless-stopped

    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # =========================================================
  # Frontend
  # =========================================================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api

    depends_on:
      - backend

    networks:
      - application_net

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

    privileged: false

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


# =========================================================
# Networks
# =========================================================
networks:

  database_net:
    driver: bridge
    internal: true

  application_net:
    driver: bridge


# =========================================================
# Persistent volumes
# =========================================================
volumes:
  postgres-data:
  whatsapp-auth:
